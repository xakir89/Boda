<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#748b73">
<title>Tu invitación | Anderson & Esmeralda</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<main>
    <section class="hero hero-invitacion" style="min-height: 100svh;">
        <div class="hero-overlay"></div>

        <div class="hero-content reveal" style="width:min(95%,560px);">

            <!-- Estado: cargando -->
            <div id="estadoCargando">
                <p class="eyebrow">UN MOMENTO</p>
                <h1 class="names" style="font-size: clamp(2.2rem,7vw,3.5rem);">Buscando tu invitación...</h1>
            </div>

            <!-- Estado: no encontrado -->
            <div id="estadoError" class="hidden">
                <p class="eyebrow">AY, NO</p>
                <h1 class="names" style="font-size: clamp(2.2rem,7vw,3.5rem);">No pudimos encontrarte</h1>
                <p style="color:white; margin-top: 10px;">Vuelve a intentar la búsqueda con tu nombre.</p>
                <button class="main-button" onclick="irA('buscar.html')">← Buscar de nuevo</button>
            </div>

            <!-- Tarjeta de invitación -->
            <div id="tarjetaInvitacion" class="invite-card hidden">
                <div class="invite-card-decoration">✿</div>

                <p class="eyebrow">INVITACIÓN PARA</p>
                <div id="selectorPasesContainer" style="margin: 15px 0;">
                    <label for="pasesSelect" style="color: var(--green-dark); font-weight: bold; display: block; margin-bottom: 5px;">
                        ¿Cuántas personas asistirán?
                    </label>
                    <select id="pasesSelect" class="input-name" style="max-width: 200px; margin: 0 auto; padding: 8px;">
                    <!-- Se llena dinámicamente con JS según el límite del invitado -->
                    </select>
                </div>
                <h2 id="nombrePareja" class="invite-names">— —</h2>
                <p id="lineaHijos" class="invite-sub hidden">e hijos</p>

                <div class="gold-line"></div>

                <div class="invite-detalle">
                    <p>Invitación para <strong id="numPases">—</strong> persona(s)</p>
                    <p>Mesa <strong id="numMesa">—</strong></p>
                </div>

                <p class="invite-fecha">7 de diciembre de 2026 · Tuluá, Valle del Cauca</p>

                <!-- Botones RSVP -->
                <div id="rsvpBotones" class="rsvp-inline-buttons">
                    <button id="btnSi" class="main-button">Sí asistiré 🎉</button>
                    <button id="btnNo" class="main-button main-button--outline">No asistiré</button>
                </div>

                <!-- Confirmación ya registrada -->
                <p id="mensajeConfirmado" class="invite-confirmado hidden"></p>
            </div>

            <!-- Acciones después de confirmar "sí" -->
            <div id="accionesPostConfirmacion" class="hidden" style="margin-top: 20px;">
                <button id="btnDescargarPng" class="main-button">📥 Descargar mi invitación</button>
                <button id="btnContinuar" class="scroll-button" style="margin-top:14px;">Continuar a la invitación completa →</button>
            </div>

        </div>
    </section>
</main>

<script src="assets/nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script type="module" src="assets/invitacion.js"></script>

</body>
</html>
