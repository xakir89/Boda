<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#748b73">
<meta name="description" content="Invitación de boda de Anderson y Esmeralda">
<title>Anderson & Esmeralda | Nuestra Boda</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">

<style>
    /* Estilos exclusivos del ARCHIVO MAESTRO (no se repiten en otras páginas) */
    html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--green-dark);
    }
    .frame-stage {
        position: fixed;
        inset: 0;
    }
    #channel {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        background: var(--cream);
    }

    /* Botón de música del maestro (vive fuera del iframe para no reiniciarse nunca) */
    .music-button {
        z-index: 600;
    }

    /* Pantalla de carga breve mientras arranca el iframe */
    .frame-loader {
        position: fixed;
        inset: 0;
        z-index: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--cream);
        font-family: 'Alex Brush', cursive;
        font-size: 3rem;
        color: var(--green-dark);
        transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    .frame-loader.hide { opacity: 0; visibility: hidden; }
</style>
</head>
<body>

<div id="frameLoader" class="frame-loader">Anderson & Esmeralda</div>

<!-- Música global: nunca se reinicia porque vive en el maestro, no en el iframe -->
<audio id="weddingMusic" loop preload="auto">
    <source src="assets/1.mp3" type="audio/mpeg">
</audio>

<button id="musicButton" class="music-button" aria-label="Activar música">🔇</button>

<div class="frame-stage">
    <iframe id="channel" src="inicio.html" title="Anderson & Esmeralda"></iframe>
</div>

<script>
/* =====================================================
   "TELEVISOR": cambia de canal sin apagar música
===================================================== */
const channel = document.getElementById("channel");
const loader = document.getElementById("frameLoader");
const music = document.getElementById("weddingMusic");
const musicButton = document.getElementById("musicButton");
let musicPlaying = false;

function iniciarMusica() {
    music.volume = 0.35;
    music.play()
        .then(() => { musicPlaying = true; musicButton.textContent = "🔊"; })
        .catch(() => { musicPlaying = false; musicButton.textContent = "🔇"; });
}

musicButton.addEventListener("click", () => {
    if (musicPlaying) {
        music.pause();
        musicPlaying = false;
        musicButton.textContent = "🔇";
    } else {
        music.play().then(() => { musicPlaying = true; musicButton.textContent = "🔊"; });
    }
});

// Oculta el loader la primera vez que el iframe carga contenido
channel.addEventListener("load", () => {
    loader.classList.add("hide");
});

// Escucha mensajes de las páginas hijas (nav.js) para cambiar de canal
window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || typeof msg !== "object") return;

    if (msg.tipo === "boda:nav" && msg.pagina) {
        channel.src = msg.pagina;
    }

    if (msg.tipo === "boda:evento") {
        if (msg.evento === "iniciarMusica") iniciarMusica();
    }
});
</script>

</body>
</html>
